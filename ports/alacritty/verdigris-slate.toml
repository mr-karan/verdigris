# Verdigris Slate
# https://github.com/mr-karan/verdigris

[colors.primary]
background = "#151a19"
foreground = "#d0d7d3"
dim_foreground = "#8e9a96"
bright_foreground = "#dde3df"

[colors.cursor]
text = "#151a19"
cursor = "#82c3b4"

[colors.vi_mode_cursor]
text = "#151a19"
cursor = "#d9a377"

[colors.selection]
